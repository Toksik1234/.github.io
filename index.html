<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtixWind — Свобода Полета</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Главный Canvas для интерактивной полярной симуляции -->
    <canvas id="snowCanvas"></canvas>

    <!-- ЭКРАН 1: Логотип в самом верху по центру и печатная карточка бренда -->
    <div class="screen-one">
        
        <!-- Заголовок поднят в самый верх, но выровнен строго по центру -->
        <h1 class="brand-title" id="mainTitle">
            <div class="letter-star star-1"></div>
            <div class="letter-star star-2"></div>
            <div class="letter-star star-3"></div>
            <div class="letter-star star-4"></div>
            <div class="letter-star star-5"></div>
            <div class="letter-star star-6"></div>
            <div class="letter-star star-7"></div>
            <div class="letter-star star-8"></div>
            ArtixWind
        </h1>

        <!-- Контейнер информации о вашем бренде расположен по центру -->
        <div class="about-us-container">
            <h2 class="about-title">О нас</h2>
            <p class="about-text" id="typewriterText"></p>
        </div>

    </div>
    
    <!-- ЭКРАН 2 -->
    <div class="screen-two"></div>
    
    <!-- ЭКРАН 3 -->
    <div class="screen-three">
        <footer></footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
